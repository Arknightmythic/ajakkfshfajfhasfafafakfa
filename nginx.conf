server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router menangani routing di sisi client (mis.
    # /batch-synchronization/investigate), jadi semua path yang tidak cocok
    # file statis harus tetap diarahkan ke index.html, bukan 404 dari nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset hasil build Vite sudah content-hashed di nama filenya, aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
